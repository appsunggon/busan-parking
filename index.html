<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>부산 공영주차장 실시간 현황</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="container">

        <!-- 상단 제목 -->
        <header class="header">

            <h1>
                부산 공영주차장 실시간 현황
            </h1>

            <p>
                부산 공영주차장의 현재 주차 가능 정보를 확인하세요.
            </p>

        </header>


        <!-- 검색 영역 -->
        <section class="search-area">

            <input type="text" id="searchInput" placeholder="주차장 이름을 입력하세요">

            <button id="searchBtn">
                검색
            </button>

        </section>


        <!-- 검색결과 / 전체보기 -->
        <section class="result-header">

            <div id="summary">
                주차장 정보를 불러오는 중입니다...
            </div>

            <button id="resetBtn" class="reset-btn">
                전체보기
            </button>

        </section>


        <!-- 주차장 목록 -->
        <main id="parkingList" class="parking-list">
        </main>


        <!-- 페이지 이동 -->
        <div id="paging" class="paging">

            <button id="prevBtn">
                이전
            </button>

            <span id="pageInfo">
                1 / 1
            </span>

            <button id="nextBtn">
                다음
            </button>

        </div>


    </div>


    <script src="app.js"></script>

</body>

</html>
